<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>nowarfy Sonic//Void Radio</title>
  <desc>Un pulso de radio cian y magenta dentro de un portal oscuro</desc>
  <defs>
    <linearGradient id="portal" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11e7ff"/>
      <stop offset="0.52" stop-color="#8d4dff"/>
      <stop offset="1" stop-color="#ff2db2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#080a12"/>
  <path d="M18 10h28l10 10v24L46 54H18L8 44V20z" fill="none" stroke="url(#portal)" stroke-width="2" opacity=".72"/>
  <path d="M21 20h22l6 6v12l-6 6H21l-6-6V26z" fill="#101525" stroke="#ff2db2" stroke-width="1.5"/>
  <path d="M21 32h5l2.4-7 4.8 15 3.2-10 2.2 5H44" fill="none" stroke="#11e7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="47" cy="17" r="2.2" fill="#ff2db2" filter="url(#glow)"/>
  <style>
    @media (prefers-color-scheme: light) {
      rect { fill: #f4f7fb; }
      path:nth-of-type(2) { fill: #ffffff; }
    }
  </style>
</svg>
