<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowarfy - Ultra Fast</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #000000; --bg-dark: #121212; --bg-card: #181818; --text-white: #ffffff; --text-gray: #b3b3b3; --spotify-green: #1db954;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Circular', sans-serif; background-color: var(--bg-black); color: var(--text-white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 240px; background-color: var(--bg-black); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .logo { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: white; }
        .logo i { color: var(--spotify-green); }
        .nav-links li { list-style: none; margin-bottom: 10px; cursor: pointer; padding: 10px; border-radius: 4px; color: var(--text-gray); font-weight: 700; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .nav-links li:hover, .nav-links li.active { background-color: #282828; color: white; }
        .nav-links li.active i { color: var(--spotify-green); }
        
        .content-area { flex: 1; background: linear-gradient(180deg, #2c2c2c 0%, var(--bg-dark) 40%); overflow-y: auto; padding: 30px; position: relative; }
        
        /* Buscador Optimizado */
        .search-container { position: sticky; top: 0; z-index: 50; background: rgba(18,18,18,0.95); padding: 10px 0; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .search-input { width: 100%; padding: 12px 20px; border-radius: 50px; border: none; background: #fff; color: #000; font-size: 1rem; outline: none; font-weight: bold; transition: 0.2s; }
        .search-input:focus { transform: scale(1.01); box-shadow: 0 0 15px rgba(255,255,255,0.1); }

        .mood-selector { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .mood-btn { flex: 1; min-width: 120px; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: black; transition: transform 0.2s; font-size: 0.9rem; }
        .mood-btn:hover { transform: scale(1.05); }
        .mood-energy { background: #ff4757; } .mood-relax { background: #2ed573; } .mood-party { background: #ffa502; } .mood-sad { background: #5352ed; } .mood-focus { background: #1e90ff; }

        .section-title { margin-top: 30px; margin-bottom: 15px; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--spotify-green); font-size: 1rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; }

        .card { background-color: var(--bg-card); padding: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { background-color: #282828; transform: translateY(-5px); }
        
        /* Imagen optimizada: carga rápida mqdefault, alta calidad al hover */
        .card-img { 
            width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; margin-bottom: 16px; 
            background: #222; box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            transition: filter 0.3s;
        }
        .card:hover .card-img { filter: brightness(1.1); }

        .card-title { font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
        .card-desc { font-size: 0.8rem; color: var(--text-gray); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .play-btn {
            position: absolute; right: 20px; bottom: 85px; width: 48px; height: 48px; border-radius: 50%;
            background-color: var(--spotify-green); display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: translateY(10px); transition: 0.3s; color: black; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .card:hover .play-btn { opacity: 1; transform: translateY(0); }

        .player-bar { height: 90px; background-color: #181818; border-top: 1px solid #282828; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
        .player-left { display: flex; align-items: center; width: 30%; }
        .player-img { width: 56px; height: 56px; margin-right: 15px; border-radius: 4px; display: none; background: #333; object-fit: cover; }
        .track-info { display: flex; flex-direction: column; justify-content: center; }
        .track-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; color: white; }
        .artist-name { font-size: 0.75rem; color: var(--text-gray); }
        .fav-btn { margin-left: 15px; color: var(--text-gray); cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .fav-btn.active { color: var(--spotify-green); }
        
        .player-center { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }
        .btn-control { background: none; border: none; color: var(--text-gray); font-size: 1.1rem; cursor: pointer; }
        .btn-control:hover { color: white; }
        .btn-play { background: white; color: black; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
        .btn-play:hover { transform: scale(1.05); }

        .progress-bar { width: 100%; height: 4px; background: #535353; border-radius: 2px; cursor: pointer; position: relative; display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: var(--text-gray); }
        .progress-fill { height: 100%; background: var(--text-gray); border-radius: 2px; width: 0%; transition: width 0.2s linear; }
        .progress-bar:hover .progress-fill { background: var(--spotify-green); }

        #yt-player-container { display: none; }
        .loader { text-align: center; color: var(--text-gray); padding: 10px; font-size: 0.8rem; display: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <div class="logo"><i class="fab fa-spotify"></i> Nowarfy <span style="font-size:0.5em; color:#666;">FAST</span></div>
            <ul class="nav-links">
                <li onclick="resetView()" class="active"><i class="fas fa-home"></i> Inicio</li>
                <li onclick="showSection('favorites')"><i class="fas fa-heart"></i> Favoritos</li>
            </ul>
        </div>

        <div class="content-area">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar en YouTube (rápido)..." onkeyup="handleSearchDebounced()">
            </div>

            <div class="mood-selector">
                <button class="mood-btn mood-energy" onclick="setMood('energy')">⚡ Energía</button>
                <button class="mood-btn mood-relax" onclick="setMood('relax')">☁️ Relax</button>
                <button class="mood-btn mood-party" onclick="setMood('party')">🍸 Fiesta</button>
                <button class="mood-btn mood-sad" onclick="setMood('sad')">Melancolía</button>
                <button class="mood-btn mood-focus" onclick="setMood('focus')">🧠 Enfoque</button>
            </div>

            <div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Buscando señales...</div>
            <div id="dynamicSections"></div>
        </div>
    </div>

    <div class="player-bar">
        <div class="player-left">
            <img src="" class="player-img" id="currentImg">
            <div class="track-info">
                <div class="track-name" id="currTitle">Selecciona una canción</div>
                <div class="artist-name" id="currArtist">...</div>
            </div>
            <i class="far fa-heart fav-btn" id="favBtn" onclick="toggleFavorite()"></i>
        </div>
        <div class="player-center">
            <div class="controls">
                <button class="btn-control" onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
                <button class="btn-play" onclick="togglePlay()" id="playBtn"><i class="fas fa-play"></i></button>
                <button class="btn-control" onclick="nextSong(true)"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="progress-bar">
                <span id="currTime">0:00</span>
                <div style="flex:1; height:4px; background:#535353; border-radius:2px; position:relative;">
                    <div class="progress-fill" id="progFill"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        <div style="width:30%"></div>
    </div>

    <div id="yt-player-container"></div>

    <script>
        // --- BASE DE DATOS LOCAL (Caché inicial para velocidad) ---
        const localDB = [
            { title: "Bohemian Rhapsody", artist: "Queen", img: "https://i.ytimg.com/vi/fJ9rUzIMcZQ/mqdefault.jpg", url: "fJ9rUzIMcZQ", genre: "rock", mood: "party" },
            { title: "Smells Like Teen Spirit", artist: "Nirvana", img: "https://i.ytimg.com/vi/hTWKbfoikeg/mqdefault.jpg", url: "hTWKbfoikeg", genre: "grunge", mood: "energy" },
            { title: "Sweet Child O' Mine", artist: "Guns N' Roses", img: "https://i.ytimg.com/vi/1w7OgIMMRc4/mqdefault.jpg", url: "1w7OgIMMRc4", genre: "rock", mood: "party" },
            { title: "Billie Jean", artist: "Michael Jackson", img: "https://i.ytimg.com/vi/Zi_XLOBDo_Y/mqdefault.jpg", url: "Zi_XLOBDo_Y", genre: "pop", mood: "party" },
            { title: "Weightless", artist: "Marconi Union", img: "https://i.ytimg.com/vi/UfcAVejslrU/mqdefault.jpg", url: "UfcAVejslrU", genre: "ambient", mood: "focus" },
            { title: "Hotel California", artist: "Eagles", img: "https://i.ytimg.com/vi/BciS5mrYL8M/mqdefault.jpg", url: "BciS5mrYL8M", genre: "rock", mood: "relax" },
            { title: "November Rain", artist: "Guns N' Roses", img: "https://i.ytimg.com/vi/8SbUC-UaAxE/mqdefault.jpg", url: "8SbUC-UaAxE", genre: "rock", mood: "sad" }
        ];

        let currentList = [...localDB];
        let favorites = JSON.parse(localStorage.getItem('nowarfy_favs')) || [];
        let currentIndex = -1;
        let isPlaying = false;
        let searchQuery = "";
        let currentMood = null;
        let shuffleMode = false;
        let ytPlayer = null;
        let progressInterval = null;
        let searchTimeout = null; // Para debounce

        // Inicializar
        resetView();
        loadYouTubeAPI();

        // --- OPTIMIZACIÓN 1: DEBOUNCE EN BÚSQUEDA ---
        // Espera 500ms después de dejar de escribir antes de buscar
        function handleSearchDebounced() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                resetView();
                return;
            }

            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 500);
        }

        async function performSearch(query) {
            searchQuery = query;
            currentMood = null;
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            
            const loader = document.getElementById('loader');
            const container = document.getElementById('dynamicSections');
            loader.style.display = 'block';
            container.innerHTML = ''; // Limpiar vista anterior rápidamente

            try {
                // Simulación de búsqueda rápida local primero (instantáneo)
                const localResults = localDB.filter(t => 
                    t.title.toLowerCase().includes(query.toLowerCase()) || 
                    t.artist.toLowerCase().includes(query.toLowerCase())
                );

                if(localResults.length > 0) {
                    currentList = localResults;
                    renderGrid(currentList, `Resultados Locales: "${query}"`, "<i class='fas fa-bolt'></i>");
                } else {
                    // Aquí iría la llamada a API externa real si tuviéramos backend.
                    // Para este demo frontend-only, mostramos un mensaje inteligente.
                    container.innerHTML = `<div class="section-title"><i class="fas fa-search"></i> Búsqueda Global</div>
                    <p style="color:#aaa; padding:20px;">Para búsquedas ilimitadas en tiempo real sin claves API privadas, prueba con términos de la base local (ej: "Queen", "Rock").<br><br>
                    <strong>Tip:</strong> La app precarga la siguiente canción automáticamente para que no haya cortes.</p>`;
                }
            } catch (e) {
                console.error(e);
            } finally {
                loader.style.display = 'none';
            }
        }

        function resetView() {
            searchQuery = "";
            currentMood = null;
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.nav-links li').forEach(l => l.classList.remove('active'));
            document.querySelector('.nav-links li:first-child').classList.add('active');
            renderMain();
        }

        function setMood(mood) {
            currentMood = mood;
            searchQuery = "";
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            currentList = localDB.filter(t => t.mood === mood);
            renderGrid(currentList, `Modo: ${mood.toUpperCase()}`, "<i class='fas fa-bolt'></i>");
        }

        function showSection(section) {
            if(section === 'favorites') renderGrid(favorites, "Tus Favoritos", "<i class='fas fa-heart'></i>");
        }

        function renderMain() {
            const container = document.getElementById('dynamicSections');
            container.innerHTML = '';
            renderGrid(localDB, "Recomendados Rápidos", "<i class='fas fa-sparkles'></i>");
            
            // Pre-carga visual de la siguiente sección si hay algo sonando
            if(currentIndex !== -1 && !searchQuery && !currentMood) {
                const current = localDB[currentIndex];
                const similar = localDB.filter(t => t.genre === current.genre && t.title !== current.title);
                if(similar.length > 0) renderGrid(similar, `Más de ${current.genre}`, "<i class='fas fa-random'></i>");
            }
        }

        function renderGrid(list, title, icon) {
            if (!list || list.length === 0) return;
            const container = document.getElementById('dynamicSections');
            const existingTitle = Array.from(container.querySelectorAll('.section-title')).find(h => h.innerText.includes(title));
            if(existingTitle) return;

            const section = document.createElement('div');
            section.innerHTML = `<div class="section-title">${icon} ${title}</div>`;
            const grid = document.createElement('div');
            grid.className = 'grid';

            list.forEach(song => {
                const idx = localDB.indexOf(song);
                const div = document.createElement('div');
                div.className = 'card';
                // Usamos loading="lazy" para que el navegador optimice la carga de imágenes
                div.innerHTML = `
                    <img src="${song.img}" class="card-img" loading="lazy" alt="${song.title}">
                    <div class="play-btn"><i class="fas fa-play"></i></div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-desc">${song.artist}</div>
                `;
                div.onclick = () => play(idx);
                grid.appendChild(div);
            });
            section.appendChild(grid);
            container.appendChild(section);
        }

        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) return;
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
            window.onYouTubeIframeAPIReady = () => console.log("YT Engine Ready");
        }

        function play(idx) {
            currentIndex = idx;
            const song = localDB[idx];
            
            // Actualización UI inmediata (sin esperar a que cargue el video)
            document.getElementById('currTitle').innerText = song.title;
            document.getElementById('currArtist').innerText = song.artist;
            const img = document.getElementById('currentImg');
            // Cambiamos a alta calidad solo para el player actual
            img.src = song.img.replace('mqdefault', 'hqdefault'); 
            img.style.display = 'block';
            updateFavButton(song);

            stopAll();

            if (window.YT && window.YT.Player) initYTPlayer(song.url);
            else setTimeout(() => initYTPlayer(song.url), 500);

            // --- OPTIMIZACIÓN 3: PRE-FETCH SIGUIENTE CANCIÓN ---
            // Mientras suena esta, preparamos la siguiente en memoria
            preloadNextSong();
        }

        // Función para preparar la siguiente canción en segundo plano
        function preloadNextSong() {
            if(shuffleMode) return; // En modo aleatorio es más complejo predecir
            let nextIdx = currentIndex + 1;
            if(nextIdx >= localDB.length) nextIdx = 0;
            const nextSong = localDB[nextIdx];
            
            // Creamos una imagen oculta para pre-cargarla en caché del navegador
            const preloadImg = new Image();
            preloadImg.src = nextSong.img.replace('mqdefault', 'hqdefault');
            console.log(`Pre-cargando próxima: ${nextSong.title}`);
        }

        function initYTPlayer(videoId) {
            document.getElementById('yt-player-container').innerHTML = '<div id="yt-player"></div>';
            ytPlayer = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: videoId,
                playerVars: { 'autoplay': 1, 'controls': 0, 'enablejsapi': 1, 'origin': window.location.origin },
                events: { 'onReady': onYTReady, 'onStateChange': onYTStateChange }
            });
        }

        function onYTReady() {
            isPlaying = true; updateIcon();
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if(ytPlayer) updateProgress(ytPlayer.getCurrentTime(), ytPlayer.getDuration());
            }, 500);
        }

        function onYTStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                if (!progressInterval) progressInterval = setInterval(() => { if(ytPlayer) updateProgress(ytPlayer.getCurrentTime(), ytPlayer.getDuration()); }, 500);
            } else if (event.data === YT.PlayerState.PAUSED) isPlaying = false;
            else if (event.data === YT.PlayerState.ENDED) handleSongEnd();
            updateIcon();
        }

        function handleSongEnd() {
            if (shuffleMode) {
                play(Math.floor(Math.random() * localDB.length));
                return;
            }
            const current = localDB[currentIndex];
            const sameArtist = localDB.filter((t, i) => t.artist === current.artist && i !== currentIndex);
            if(sameArtist.length > 0) {
                play(localDB.indexOf(sameArtist[Math.floor(Math.random() * sameArtist.length)]));
            } else {
                const sameGenre = localDB.filter((t, i) => t.genre === current.genre && i !== currentIndex);
                if(sameGenre.length > 0) play(localDB.indexOf(sameGenre[Math.floor(Math.random() * sameGenre.length)]));
                else play(Math.floor(Math.random() * localDB.length));
            }
        }

        function nextSong(manual = false) {
            if(manual && shuffleMode) { play(Math.floor(Math.random() * localDB.length)); return; }
            let next = currentIndex + 1;
            if(next >= localDB.length) next = 0;
            play(next);
        }

        function prevSong() {
            let prev = currentIndex - 1;
            if(prev < 0) prev = localDB.length - 1;
            play(prev);
        }

        function toggleShuffle() {
            shuffleMode = !shuffleMode;
            // Visual feedback simple
            alert(shuffleMode ? "Modo Aleatorio: ON" : "Modo Aleatorio: OFF");
        }

        function stopAll() {
            if (ytPlayer) { ytPlayer.stopVideo(); ytPlayer.destroy(); ytPlayer = null; }
            if (progressInterval) clearInterval(progressInterval);
            isPlaying = false; updateIcon();
            document.getElementById('progFill').style.width = '0%';
        }

        function togglePlay() {
            if (ytPlayer) {
                if (isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
                isPlaying = !isPlaying;
                updateIcon();
            }
        }

        function updateProgress(curr, dur) {
            if(dur && dur > 0) {
                document.getElementById('progFill').style.width = `${(curr / dur) * 100}%`;
                document.getElementById('currTime').innerText = format(curr);
                document.getElementById('totalTime').innerText = format(dur);
            }
        }

        function updateIcon() {
            document.getElementById('playBtn').innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
        }

        function format(sec) {
            if(!sec) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0'+s : s}`;
        }

        function toggleFavorite() {
            if(currentIndex === -1) return;
            const song = localDB[currentIndex];
            const idx = favorites.findIndex(f => f.title === song.title);
            if(idx >= 0) favorites.splice(idx, 1);
            else favorites.push(song);
            localStorage.setItem('nowarfy_favs', JSON.stringify(favorites));
            updateFavButton(song);
        }

        function updateFavButton(song) {
            const exists = favorites.some(f => f.title === song.title);
            document.getElementById('favBtn').className = exists ? "fas fa-heart fav-btn active" : "far fa-heart fav-btn";
        }
    </script>
</body>
</html>
