<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowarfy - Híbrido Ilimitado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react-player@latest/dist/ReactPlayer.min.js"></script>
    
    <style>
        :root {
            --bg-black: #000000;
            --bg-dark: #121212;
            --bg-card: #181818;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --color-yt: #ff0000; /* Rojo para YouTube */
            --color-free: #00d4ff; /* Cian para Libre */
        }

        body { font-family: 'Circular', sans-serif; background-color: var(--bg-black); color: var(--text-white); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 240px; background-color: var(--bg-black); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .logo { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--color-free); }
        
        .nav-links li { list-style: none; margin-bottom: 15px; cursor: pointer; }
        .nav-links a { text-decoration: none; color: var(--text-gray); font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-white); }
        .mode-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
        .mode-yt { background: var(--color-yt); color: white; }
        .mode-free { background: var(--color-free); color: black; }

        .content-area { flex: 1; background: linear-gradient(180deg, #2c2c2c 0%, var(--bg-dark) 40%); overflow-y: auto; padding: 20px 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-bar { background: white; border-radius: 500px; padding: 8px 15px; display: flex; align-items: center; width: 300px; color: black; }
        .search-bar input { border: none; outline: none; margin-left: 10px; width: 100%; }

        h2 { margin-bottom: 20px; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
        
        .card { background-color: var(--bg-card); padding: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { background-color: #282828; transform: translateY(-5px); }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .card-title { font-weight: 700; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { color: var(--text-gray); font-size: 0.85rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .play-btn-card { position: absolute; right: 20px; bottom: 80px; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(10px); transition: 0.3s; color: black; font-size: 1.2rem; }
        .card:hover .play-btn-card { opacity: 1; transform: translateY(0); }
        .btn-yt { background-color: var(--color-yt); }
        .btn-free { background-color: var(--color-free); }

        .player-bar { height: 90px; background-color: #181818; border-top: 1px solid #282828; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
        .player-left { display: flex; align-items: center; width: 30%; }
        .player-img { width: 56px; height: 56px; margin-right: 14px; border-radius: 4px; }
        .track-info { display: flex; flex-direction: column; justify-content: center; margin-right: 20px; }
        .track-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
        .artist-name { font-size: 0.75rem; color: var(--text-gray); }
        
        .player-center { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .controls-buttons { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }
        .control-btn { background: none; border: none; color: var(--text-gray); font-size: 1rem; cursor: pointer; }
        .control-btn:hover { color: white; }
        .play-pause-btn { background-color: white; color: black; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: var(--text-gray); }
        .progress-bar { flex: 1; height: 4px; background-color: #535353; border-radius: 2px; cursor: pointer; }
        .progress-fill { height: 100%; background-color: white; border-radius: 2px; width: 0%; }

        #hidden-player { position: absolute; top: -9999px; left: -9999px; }
        
        .status-msg { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; z-index: 200; display: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo"><i class="fas fa-infinity"></i> Nowarfy <span style="font-size:0.5em; color:var(--text-gray)">HÍBRIDO</span></div>
            <ul class="nav-links">
                <li><a onclick="switchMode('yt')" id="link-yt" class="active"><i class="fab fa-youtube"></i> Éxitos (YouTube) <span class="mode-badge mode-yt">ILIMITADO</span></a></li>
                <li><a onclick="switchMode('free')" id="link-free"><i class="fas fa-music"></i> Indie/Libre (Jamendo) <span class="mode-badge mode-free">LEGAL</span></a></li>
                <li><a href="#"><i class="fas fa-book"></i> Tu Biblioteca</a></li>
            </ul>
        </div>

        <!-- CONTENIDO -->
        <div class="content-area">
            <div class="top-bar">
                <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Buscar música..."></div>
                <div style="background:black; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center;"><i class="fas fa-user" style="color:white;"></i></div>
            </div>

            <h2 id="sectionTitle"><i class="fab fa-youtube" style="color:var(--color-yt)"></i> Éxitos Mundiales</h2>
            <div class="cards-grid" id="songsGrid"></div>
        </div>
    </div>

    <!-- PLAYER BAR -->
    <div class="player-bar">
        <div class="player-left">
            <img src="" alt="" class="player-img" id="currentTrackImg" style="display:none;">
            <div class="track-info">
                <div class="track-name" id="currentTrackName">Selecciona una canción</div>
                <div class="artist-name" id="currentArtistName">...</div>
            </div>
        </div>
        <div class="player-center">
            <div class="controls-buttons">
                <button class="control-btn" onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
                <button class="play-pause-btn" onclick="togglePlay()" id="mainPlayBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" onclick="nextSong()"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        <div style="width: 30%;"></div>
    </div>

    <div id="hidden-player"></div>
    <div id="statusMsg" class="status-msg">Cargando...</div>

    <script>
        // --- DATOS HÍBRIDOS ---
        
        // MODO 1: YOUTUBE (Hack/Comercial)
        const ytSongs = [
            { title: "Bohemian Rhapsody", artist: "Queen", img: "https://i.scdn.co/image/ab67616d0000b273ce4f1737bc8a646c8c4bd25a", desc: "El clásico definitivo.", type: "yt", url: "https://www.youtube.com/watch?v=fJ9rUzIMcZQ" },
            { title: "Smells Like Teen Spirit", artist: "Nirvana", img: "https://i.scdn.co/image/ab67616d0000b273e175a19e530c898d167d39bf", desc: "Himno del grunge.", type: "yt", url: "https://www.youtube.com/watch?v=hTWKbfoikeg" },
            { title: "Sweet Child O' Mine", artist: "Guns N' Roses", img: "https://i.scdn.co/image/ab67616d0000b27321ebf52088e17992674527a9", desc: "Rock legendario.", type: "yt", url: "https://www.youtube.com/watch?v=1w7OgIMMRc4" }
        ];

        // MODO 2: JAMENDO (Legal/Gratis) - Datos simulados de ejemplos reales de Jamendo
        const freeSongs = [
            { title: "Cyberpunk Dream", artist: "Laser Unicorn", img: "https://res.cloudinary.com/dmjq1y0qo/image/upload/c_fill,f_auto,h_300,q_auto,w_300/v1/jamendo-images/i3456789.jpg", desc: "Electrónica libre de derechos.", type: "free", url: "https://mp3d.jamendo.com/track/123456/download" }, 
            { title: "Acoustic Sunrise", artist: "Free Folk Band", img: "https://res.cloudinary.com/dmjq1y0qo/image/upload/c_fill,f_auto,h_300,q_auto,w_300/v1/jamendo-images/i9876543.jpg", desc: "Folk tranquilo para estudiar.", type: "free", url: "https://mp3d.jamendo.com/track/654321/download" }
            // Nota: En producción, estos URLs vendrían de la API real de Jamendo.
        ];

        let currentMode = 'yt'; // 'yt' o 'free'
        let currentList = ytSongs;
        let currentPlayer = null;
        let currentSongIndex = -1;
        let isPlaying = false;

        // Inicializar
        renderList();

        function switchMode(mode) {
            currentMode = mode;
            currentList = mode === 'yt' ? ytSongs : freeSongs;
            
            // Actualizar UI Sidebar
            document.getElementById('link-yt').classList.toggle('active', mode === 'yt');
            document.getElementById('link-free').classList.toggle('active', mode === 'free');
            
            // Actualizar Título
            const title = document.getElementById('sectionTitle');
            if (mode === 'yt') {
                title.innerHTML = '<i class="fab fa-youtube" style="color:var(--color-yt)"></i> Éxitos Mundiales (YouTube)';
            } else {
                title.innerHTML = '<i class="fas fa-music" style="color:var(--color-free)"></i> Indie & Libre (Jamendo)';
            }

            renderList();
            showStatus(`Modo cambiado a: ${mode === 'yt' ? 'Éxitos Ilimitados' : 'Música Libre Legal'}`);
        }

        function renderList() {
            const grid = document.getElementById('songsGrid');
            grid.innerHTML = '';
            currentList.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                const btnClass = song.type === 'yt' ? 'btn-yt' : 'btn-free';
                const icon = song.type === 'yt' ? 'fab fa-youtube' : 'fas fa-music';
                
                card.innerHTML = `
                    <div style="position:relative;">
                        <img src="${song.img}" class="card-img" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        <div class="play-btn-card ${btnClass}" onclick="event.stopPropagation(); playSong(${index})"><i class="${icon}"></i></div>
                    </div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-desc">${song.desc}</div>
                `;
                card.onclick = () => playSong(index);
                grid.appendChild(card);
            });
        }

        function playSong(index) {
            currentSongIndex = index;
            const song = currentList[index];
            
            document.getElementById('currentTrackName').innerText = song.title;
            document.getElementById('currentArtistName').innerText = song.artist;
            const img = document.getElementById('currentTrackImg');
            img.src = song.img;
            img.style.display = 'block';

            showStatus(`Reproduciendo desde ${song.type === 'yt' ? 'YouTube' : 'Fuente Libre'}...`);

            document.getElementById('hidden-player').innerHTML = '';
            currentPlayer = new window.ReactPlayer.default('#hidden-player', {
                url: song.url,
                playing: true,
                controls: false,
                volume: 0.8,
                onProgress: (state) => updateProgress(state),
                onReady: () => updatePlayIcon(true),
                onEnded: () => nextSong(),
                onError: (err) => {
                    console.error(err);
                    showStatus("Error al cargar audio. Probando siguiente...");
                    setTimeout(nextSong, 2000);
                }
            });
            isPlaying = true;
        }

        function togglePlay() {
            if (!currentPlayer) return;
            const iframe = document.querySelector('#hidden-player iframe');
            if (iframe) {
                if (isPlaying) {
                    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                    updatePlayIcon(false);
                } else {
                    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                    updatePlayIcon(true);
                }
                isPlaying = !isPlaying;
            } else {
                // Para archivos MP3 directos (Jamendo)
                const audio = document.querySelector('#hidden-player audio');
                if(audio) {
                    if(isPlaying) audio.pause();
                    else audio.play();
                    isPlaying = !isPlaying;
                    updatePlayIcon(isPlaying);
                }
            }
        }

        function nextSong() {
            let next = currentSongIndex + 1;
            if (next >= currentList.length) next = 0;
            playSong(next);
        }

        function prevSong() {
            let prev = currentSongIndex - 1;
            if (prev < 0) prev = currentList.length - 1;
            playSong(prev);
        }

        function updatePlayIcon(playing) {
            document.getElementById('mainPlayBtn').innerHTML = playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
        }

        function updateProgress(state) {
            const total = state.duration || 0;
            const current = state.playedSeconds || 0;
            if(total > 0) {
                document.getElementById('progressFill').style.width = `${(current / total) * 100}%`;
                document.getElementById('currentTime').innerText = formatTime(current);
                document.getElementById('totalTime').innerText = formatTime(total);
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showStatus(msg) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
