<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowarfy - Música Ilimitada</title>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React Player -->
    <script src="https://cdn.jsdelivr.net/npm/react-player@latest/dist/ReactPlayer.min.js"></script>
    
    <style>
        :root {
            --bg-black: #000000;
            --bg-dark: #121212;
            --bg-card: #181818;
            --bg-hover: #282828;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --nowarfy-green: #1db954; /* Puedes cambiar esto por morado/neón luego */
            --nowarfy-green-hover: #1ed760;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Circular', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Layout Principal */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-black);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            color: var(--text-white);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -1px;
        }
        .logo i { color: var(--nowarfy-green); }

        .nav-links li { list-style: none; margin-bottom: 15px; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-white); }

        /* Contenido Central */
        .content-area {
            flex: 1;
            background: linear-gradient(180deg, #2c2c2c 0%, var(--bg-dark) 40%);
            background-color: var(--bg-dark);
            overflow-y: auto;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(18, 18, 18, 0.8);
            padding: 10px 0;
            backdrop-filter: blur(10px);
        }

        .search-bar {
            background-color: white;
            border-radius: 500px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            width: 300px;
            color: black;
        }
        .search-bar input { border: none; outline: none; margin-left: 10px; width: 100%; font-size: 0.9rem; }

        h2 { margin-bottom: 20px; font-size: 1.5rem; font-weight: 800; }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover { background-color: var(--bg-hover); transform: translateY(-5px); }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .card-title { font-weight: 700; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { color: var(--text-gray); font-size: 0.85rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .play-btn-card {
            position: absolute;
            right: 20px;
            bottom: 80px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--nowarfy-green);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 8px rgba(0,0,0,0.3);
            color: black;
            font-size: 1.2rem;
        }
        .card:hover .play-btn-card { opacity: 1; transform: translateY(0); }
        .play-btn-card:hover { background-color: var(--nowarfy-green-hover); transform: scale(1.05); }

        /* Player Bar Inferior */
        .player-bar {
            height: 90px;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .player-left { display: flex; align-items: center; width: 30%; min-width: 180px; }
        .player-img { width: 56px; height: 56px; margin-right: 14px; border-radius: 4px; }
        .track-info { display: flex; flex-direction: column; justify-content: center; margin-right: 20px; }
        .track-name { font-size: 0.9rem; font-weight: 700; color: white; margin-bottom: 4px; cursor: pointer; }
        .artist-name { font-size: 0.75rem; color: var(--text-gray); cursor: pointer; }
        .track-name:hover, .artist-name:hover { text-decoration: underline; color: white; }

        .player-center { display: flex; flex-direction: column; align-items: center; width: 40%; max-width: 722px; }
        .controls-buttons { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }
        .control-btn { background: none; border: none; color: var(--text-gray); font-size: 1rem; cursor: pointer; transition: color 0.2s; }
        .control-btn:hover { color: white; }
        .play-pause-btn {
            background-color: white; color: black; border-radius: 50%; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: transform 0.2s;
        }
        .play-pause-btn:hover { transform: scale(1.05); }

        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: var(--text-gray); }
        .progress-bar { flex: 1; height: 4px; background-color: #535353; border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background-color: white; border-radius: 2px; width: 0%; transition: width 0.1s linear; }
        .progress-bar:hover .progress-fill { background-color: var(--nowarfy-green); }

        .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .volume-bar { width: 100px; height: 4px; background-color: #535353; border-radius: 2px; cursor: pointer; }
        .volume-fill { width: 70%; height: 100%; background-color: white; border-radius: 2px; }

        #hidden-player { position: absolute; top: -9999px; left: -9999px; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo"><i class="fab fa-spotify"></i> Nowarfy</div>
            <ul class="nav-links">
                <li><a href="#" class="active"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="#"><i class="fas fa-search"></i> Buscar</a></li>
                <li><a href="#"><i class="fas fa-book"></i> Tu Biblioteca</a></li>
            </ul>
            <div style="height:1px; background:#282828; margin:10px 0;"></div>
            <ul class="nav-links">
                <li><a href="#"><i class="fas fa-plus-square"></i> Crear lista</a></li>
                <li><a href="#"><i class="fas fa-heart"></i> Tus Me gusta</a></li>
            </ul>
        </div>

        <!-- CONTENIDO -->
        <div class="content-area">
            <div class="top-bar">
                <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="¿Qué quieres escuchar?"></div>
                <div style="background:black; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center;"><i class="fas fa-user" style="color:white;"></i></div>
            </div>

            <h2>Hecho para Nowarfy</h2>
            <div class="cards-grid" id="songsGrid"></div>
            
            <br><br>
            <h2>Música Épica</h2>
            <div class="cards-grid" id="epicGrid"></div>
        </div>
    </div>

    <!-- PLAYER BAR -->
    <div class="player-bar">
        <div class="player-left">
            <img src="" alt="" class="player-img" id="currentTrackImg" style="display:none;">
            <div class="track-info">
                <div class="track-name" id="currentTrackName">Selecciona una canción</div>
                <div class="artist-name" id="currentArtistName">...</div>
            </div>
            <i class="far fa-heart control-btn"></i>
        </div>

        <div class="player-center">
            <div class="controls-buttons">
                <button class="control-btn"><i class="fas fa-random"></i></button>
                <button class="control-btn" onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
                <button class="play-pause-btn" onclick="togglePlay()" id="mainPlayBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" onclick="nextSong()"><i class="fas fa-step-forward"></i></button>
                <button class="control-btn"><i class="fas fa-redo"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <i class="fas fa-microphone control-btn"></i>
            <i class="fas fa-list control-btn"></i>
            <i class="fas fa-volume-up control-btn"></i>
            <div class="volume-bar"><div class="volume-fill"></div></div>
        </div>
    </div>

    <div id="hidden-player"></div>

    <script>
        // --- DATOS DE EJEMPLO (Simulando API) ---
        const songs = [
            { title: "Bohemian Rhapsody", artist: "Queen", img: "https://i.scdn.co/image/ab67616d0000b273ce4f1737bc8a646c8c4bd25a", desc: "Rock clásico atemporal." },
            { title: "Sweet Child O' Mine", artist: "Guns N' Roses", img: "https://i.scdn.co/image/ab67616d0000b27321ebf52088e17992674527a9", desc: "El riff más famoso." },
            { title: "Smells Like Teen Spirit", artist: "Nirvana", img: "https://i.scdn.co/image/ab67616d0000b273e175a19e530c898d167d39bf", desc: "Himno del grunge." },
            { title: "Billie Jean", artist: "Michael Jackson", img: "https://i.scdn.co/image/ab67616d0000b273de3c04b5fc750b68899b20a9", desc: "Thriller legendario." },
            { title: "Hotel California", artist: "Eagles", img: "https://i.scdn.co/image/ab67616d0000b2734637341b9f507521afa9a778", desc: "Un viaje inolvidable." },
            { title: "Comfortably Numb", artist: "Pink Floyd", img: "https://i.scdn.co/image/ab67616d0000b273ea7caaff71dea1051d49b2fe", desc: "Obra maestra." }
        ];

        // Mapeo de IDs de YouTube (En producción esto sería dinámico)
        const ytMap = {
            "Bohemian Rhapsody Queen": "fJ9rUzIMcZQ",
            "Sweet Child O' Mine Guns N' Roses": "1w7OgIMMRc4",
            "Smells Like Teen Spirit Nirvana": "hTWKbfoikeg",
            "Billie Jean Michael Jackson": "Zi_XLOBDo_Y",
            "Hotel California Eagles": "BciS5mrYL8M",
            "Comfortably Numb Pink Floyd": "_FrOQCgaE7A"
        };

        let currentPlayer = null;
        let currentSongIndex = -1;
        let isPlaying = false;

        // Renderizar Tarjetas
        function renderGrid(data, elementId) {
            const grid = document.getElementById(elementId);
            data.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="position:relative;">
                        <img src="${song.img}" class="card-img" alt="${song.title}">
                        <div class="play-btn-card" onclick="event.stopPropagation(); playSong(${index})"><i class="fas fa-play"></i></div>
                    </div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-desc">${song.desc}</div>
                `;
                card.onclick = () => playSong(index);
                grid.appendChild(card);
            });
        }

        renderGrid(songs, 'songsGrid');
        renderGrid(songs.reverse(), 'epicGrid'); // Duplicamos para demo

        // Lógica del Reproductor
        function initPlayer() {
            if (!window.ReactPlayer) return;
            currentPlayer = new window.ReactPlayer.default('#hidden-player', {
                url: '', playing: false, controls: false, volume: 0.8,
                onProgress: (state) => updateProgress(state),
                onEnded: () => nextSong()
            });
        }

        function playSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            document.getElementById('currentTrackName').innerText = song.title;
            document.getElementById('currentArtistName').innerText = song.artist;
            const img = document.getElementById('currentTrackImg');
            img.src = song.img; img.style.display = 'block';

            const key = `${song.title} ${song.artist}`;
            const videoId = ytMap[key];
            if (!videoId) return alert("Video no encontrado en demo");

            const url = `https://www.youtube.com/watch?v=${videoId}`;
            document.getElementById('hidden-player').innerHTML = '';
            currentPlayer = new window.ReactPlayer.default('#hidden-player', {
                url: url, playing: true, controls: false, volume: 0.8,
                onProgress: (state) => updateProgress(state),
                onReady: () => updatePlayIcon(true),
                onEnded: () => nextSong()
            });
            isPlaying = true;
        }

        function togglePlay() {
            if (!currentPlayer) return;
            const iframe = document.querySelector('#hidden-player iframe');
            if (iframe) {
                if (isPlaying) {
                    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                    updatePlayIcon(false);
                } else {
                    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                    updatePlayIcon(true);
                }
                isPlaying = !isPlaying;
            }
        }

        function nextSong() {
            let next = currentSongIndex + 1;
            if (next >= songs.length) next = 0;
            playSong(next);
        }

        function prevSong() {
            let prev = currentSongIndex - 1;
            if (prev < 0) prev = songs.length - 1;
            playSong(prev);
        }

        function updatePlayIcon(playing) {
            document.getElementById('mainPlayBtn').innerHTML = playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
        }

        function updateProgress(state) {
            const total = state.duration || 0;
            const current = state.playedSeconds || 0;
            if(total > 0) {
                document.getElementById('progressFill').style.width = `${(current / total) * 100}%`;
                document.getElementById('currentTime').innerText = formatTime(current);
                document.getElementById('totalTime').innerText = formatTime(total);
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        initPlayer();
    </script>
</body>
</html>
